<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Cuentas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg: #F4F5F7;
  --card: #FFFFFF;
  --border: #E4E6EA;
  --ink: #14161A;
  --grey: #6B7280;
  --grey-light: #9CA3AF;
  --green: #16A34A;
  --red: #DC2626;
  --accent: #2563EB;
  --accent-light: #EFF4FF;
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  min-height:100vh;
  padding: 20px 14px 60px;
}

.wrap{ max-width: 480px; margin: 0 auto; }

header{ margin-bottom: 20px; }
header h1{ font-size: 22px; font-weight: 800; letter-spacing:-0.3px; }
header p{ font-size: 13px; color: var(--grey); margin-top: 2px; }

nav.tabs{
  display:flex; gap: 4px; margin-bottom: 18px;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 4px; overflow-x:auto;
}
nav.tabs button{
  flex: 1; background:none; border:none; cursor:pointer;
  font-family:'Inter', sans-serif; font-weight:600; font-size:13px;
  color: var(--grey); padding: 9px 8px; border-radius: 7px; white-space:nowrap;
}
nav.tabs button.active{ background: var(--ink); color: #fff; }

.card{
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px; margin-bottom: 14px;
}

.card-title{ font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.card-title.mb0{ margin-bottom: 0; }

.stat-row{
  display:flex; justify-content:space-between; align-items:center;
  padding: 9px 0; border-bottom: 1px solid var(--border);
}
.stat-row:last-of-type{ border-bottom: none; }
.stat-row .label{ font-size: 13px; color: var(--grey); }
.stat-row .value{ font-size: 15px; font-weight: 700; }
.stat-row .value.pos{ color: var(--green); }
.stat-row .value.neg{ color: var(--red); }

.big-total{
  display:flex; justify-content:space-between; align-items:center;
  padding-top: 12px; margin-top: 4px; border-top: 2px solid var(--ink);
}
.big-total .label{ font-size: 13px; font-weight:600; color: var(--grey); text-transform:uppercase; letter-spacing:0.3px; }
.big-total .value{ font-size: 24px; font-weight: 800; }
.big-total .value.pos{ color: var(--green); }
.big-total .value.neg{ color: var(--red); }

.badge{
  display:inline-block; margin-top: 10px; padding: 6px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 700; background: #DCFCE7; color: var(--green);
}
.badge.debe{ background: #FEE2E2; color: var(--red); }

.month-picker{
  display:flex; align-items:center; gap: 10px; margin-bottom: 14px;
}
.month-picker label{ font-size: 13px; color: var(--grey); font-weight:600; }
.month-picker input{
  font-family:'Inter', sans-serif; font-size: 14px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--card); flex:1;
}

form.entry{ display:flex; flex-direction:column; gap: 10px; }
.f-row{ display:flex; gap: 10px; }
.field{ display:flex; flex-direction:column; gap: 4px; flex:1; }
.field label{ font-size: 12px; font-weight: 600; color: var(--grey); }
.field input, .field select{
  font-family:'Inter', sans-serif; font-size: 14px; padding: 9px 10px;
  border: 1px solid var(--border); border-radius: 8px; background: #FAFAFB; color: var(--ink);
}
.field input:focus, .field select:focus{ outline: 2px solid var(--accent); outline-offset: -1px; background: #fff; }

button.primary{
  background: var(--ink); color: #fff; border: none; padding: 11px;
  font-family:'Inter', sans-serif; font-weight: 700; font-size: 14px;
  border-radius: 9px; cursor: pointer; margin-top: 2px;
}
button.primary:hover{ background: #000; }

.list{ margin-top: 4px; }
.item{
  display:flex; align-items:center; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.item:last-child{ border-bottom:none; }
.item .i-date{ font-size: 12px; color: var(--grey-light); white-space:nowrap; width: 40px; }
.item .i-main{ flex:1; min-width:0; }
.item .i-cat{
  font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-light);
  padding: 2px 7px; border-radius: 5px; display:inline-block; margin-bottom: 2px;
}
.item .i-desc{ font-size: 12px; color: var(--grey); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .i-amt{ font-size: 14px; font-weight: 700; white-space:nowrap; }
.item .i-amt.pos{ color: var(--green); }
.item .i-amt.neg{ color: var(--red); }
.item .del{
  background:none; border:none; color: var(--grey-light); cursor:pointer; font-size: 16px; padding: 0 2px;
}
.item .del:hover{ color: var(--red); }

.empty{ font-size: 13px; color: var(--grey-light); text-align:center; padding: 16px 0; }

.settings-row{ display:flex; align-items:center; gap: 8px; font-size: 13px; color: var(--grey); margin-top: 10px; }
.settings-row input{
  width: 56px; font-family:'Inter', sans-serif; padding: 6px 8px; border:1px solid var(--border); border-radius: 6px;
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Mis Cuentas</h1>
    <p>Raw Soft · Tamar Textil · Sueldo · Maaser · Ahorro USD</p>
  </header>

  <nav class="tabs">
    <button data-tab="resumen" class="active">Resumen</button>
    <button data-tab="ingresos">Ingresos</button>
    <button data-tab="gastos">Gastos</button>
    <button data-tab="maaser">Maaser</button>
    <button data-tab="usd">USD</button>
  </nav>

  <div id="content"></div>
</div>

<script>
const CATS_INGRESO = ["Sueldo","Máquina (Raw Soft)","Telas (Tamar Textil)","Me dio el tío","Extra"];

let state = {
  movements: [],
  maaserPagos: [],
  usd: [],
  settings: { maaserPct: 10 }
};

let activeTab = 'resumen';
let currentMonth = new Date().toISOString().slice(0,7);

const fmtARS = n => '$' + Number(n||0).toLocaleString('es-AR', {minimumFractionDigits:0, maximumFractionDigits:0});
const fmtUSD = n => 'US$' + Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayStr = () => new Date().toISOString().slice(0,10);

async function loadAll(){
  try{ const m = localStorage.getItem('movements'); state.movements = m ? JSON.parse(m) : []; }
  catch(e){ state.movements = []; }
  try{ const p = localStorage.getItem('maaser_pagos'); state.maaserPagos = p ? JSON.parse(p) : []; }
  catch(e){ state.maaserPagos = []; }
  try{ const u = localStorage.getItem('usd_savings'); state.usd = u ? JSON.parse(u) : []; }
  catch(e){ state.usd = []; }
  try{ const s = localStorage.getItem('settings'); state.settings = s ? JSON.parse(s) : {maaserPct:10}; }
  catch(e){ state.settings = {maaserPct:10}; }
}
async function save(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('error guardando', key, e); }
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
  render();
}
document.querySelectorAll('nav.tabs button').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.tab)));

function movsDelMes(month){ return state.movements.filter(m => m.fecha.slice(0,7) === month); }
function ingresosDelMes(month){ return movsDelMes(month).filter(m=>m.type==='ingreso'); }
function gastosDelMes(month){ return movsDelMes(month).filter(m=>m.type==='gasto'); }
function totalIngresos(month){ return ingresosDelMes(month).reduce((a,m)=>a+m.monto,0); }
function totalGastos(month){ return gastosDelMes(month).reduce((a,m)=>a+m.monto,0); }

function pct(){ return (state.settings.maaserPct||10)/100; }
function maaserGeneradoTotal(){ return state.movements.filter(m=>m.type==='ingreso').reduce((a,m)=>a+m.monto*pct(),0); }
function maaserPagadoTotal(){ return state.maaserPagos.reduce((a,p)=>a+p.monto,0); }
function maaserPendiente(){ return Math.max(0, maaserGeneradoTotal() - maaserPagadoTotal()); }
function maaserGeneradoMes(month){ return ingresosDelMes(month).reduce((a,m)=>a+m.monto*pct(),0); }
function usdTotal(){ return state.usd.reduce((a,u)=>a+u.montoUSD,0); }

function render(){
  const el = document.getElementById('content');
  if(activeTab==='resumen') el.innerHTML = renderResumen();
  else if(activeTab==='ingresos') el.innerHTML = renderIngresos();
  else if(activeTab==='gastos') el.innerHTML = renderGastos();
  else if(activeTab==='maaser') el.innerHTML = renderMaaser();
  else if(activeTab==='usd') el.innerHTML = renderUSD();
  wireEvents();
}

function monthLabel(month){
  const [y,m] = month.split('-');
  const nombres = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  return nombres[parseInt(m,10)-1] + " " + y;
}

function renderResumen(){
  const ing = totalIngresos(currentMonth);
  const gas = totalGastos(currentMonth);
  const saldo = ing - gas;
  const maaserMes = maaserGeneradoMes(currentMonth);
  const pendiente = maaserPendiente();

  return `
  <div class="month-picker">
    <label>Mes</label>
    <input type="month" id="monthInput" value="${currentMonth}">
  </div>

  <div class="card">
    <div class="card-title">Balance de ${monthLabel(currentMonth)}</div>
    <div class="stat-row"><span class="label">Ingresaste</span><span class="value pos">${fmtARS(ing)}</span></div>
    <div class="stat-row"><span class="label">Gastaste</span><span class="value neg">${fmtARS(gas)}</span></div>
    <div class="big-total">
      <span class="label">Te queda</span>
      <span class="value ${saldo>=0?'pos':'neg'}">${fmtARS(saldo)}</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Maaser</div>
    <div class="stat-row"><span class="label">Generado este mes</span><span class="value">${fmtARS(maaserMes)}</span></div>
    <div class="stat-row"><span class="label">Pagado (histórico)</span><span class="value">${fmtARS(maaserPagadoTotal())}</span></div>
    <div class="big-total">
      <span class="label">Debés</span>
      <span class="value ${pendiente>0?'neg':'pos'}">${fmtARS(pendiente)}</span>
    </div>
    ${pendiente > 0 ? `<span class="badge debe">Debés maaser</span>` : `<span class="badge">Estás al día</span>`}
  </div>

  <div class="card">
    <div class="card-title">Ahorro en dólares</div>
    <div class="big-total" style="border-top:none; padding-top:0; margin-top:0;">
      <span class="label">Llevás ahorrado</span>
      <span class="value" style="color:var(--accent);">${fmtUSD(usdTotal())}</span>
    </div>
  </div>
  `;
}

function renderIngresos(){
  const items = [...state.movements].filter(m=>m.type==='ingreso').sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const rows = items.map(m=>`
    <div class="item">
      <span class="i-date">${m.fecha.slice(5)}</span>
      <div class="i-main">
        <span class="i-cat">${m.categoria}</span>
        ${m.desc ? `<div class="i-desc">${m.desc}</div>` : ''}
      </div>
      <span class="i-amt pos">${fmtARS(m.monto)}</span>
      <button class="del" data-del-mov="${m.id}">✕</button>
    </div>
  `).join('');

  return `
  <div class="card">
    <div class="card-title">Cargar ingreso</div>
    <form class="entry" id="formIngreso">
      <div class="f-row">
        <div class="field">
          <label>Fecha</label>
          <input type="date" name="fecha" value="${todayStr()}" required>
        </div>
        <div class="field">
          <label>Categoría</label>
          <select name="categoria">
            ${CATS_INGRESO.map(c=>`<option value="${c}">${c}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Descripción (opcional)</label>
        <input type="text" name="desc">
      </div>
      <div class="field">
        <label>Monto ($)</label>
        <input type="number" name="monto" step="0.01" min="0" required>
      </div>
      <button type="submit" class="primary">Agregar ingreso</button>
    </form>
  </div>

  <div class="card">
    <div class="card-title">Ingresos cargados</div>
    <div class="list">
      ${items.length ? rows : `<div class="empty">Todavía no cargaste ningún ingreso.</div>`}
    </div>
  </div>
  `;
}

function renderGastos(){
  const items = [...state.movements].filter(m=>m.type==='gasto').sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const rows = items.map(m=>`
    <div class="item">
      <span class="i-date">${m.fecha.slice(5)}</span>
      <div class="i-main">
        <span class="i-cat" style="color:var(--red); background:#FEE2E2;">${m.categoria}</span>
        ${m.desc ? `<div class="i-desc">${m.desc}</div>` : ''}
      </div>
      <span class="i-amt neg">${fmtARS(m.monto)}</span>
      <button class="del" data-del-mov="${m.id}">✕</button>
    </div>
  `).join('');

  return `
  <div class="card">
    <div class="card-title">Cargar gasto</div>
    <form class="entry" id="formGasto">
      <div class="f-row">
        <div class="field">
          <label>Fecha</label>
          <input type="date" name="fecha" value="${todayStr()}" required>
        </div>
        <div class="field">
          <label>Categoría</label>
          <input type="text" name="categoria" placeholder="ej: insumos" required>
        </div>
      </div>
      <div class="field">
        <label>Descripción (opcional)</label>
        <input type="text" name="desc">
      </div>
      <div class="field">
        <label>Monto ($)</label>
        <input type="number" name="monto" step="0.01" min="0" required>
      </div>
      <button type="submit" class="primary">Agregar gasto</button>
    </form>
  </div>

  <div class="card">
    <div class="card-title">Gastos cargados</div>
    <div class="list">
      ${items.length ? rows : `<div class="empty">Todavía no cargaste ningún gasto.</div>`}
    </div>
  </div>
  `;
}

function renderMaaser(){
  const generado = maaserGeneradoTotal();
  const pagado = maaserPagadoTotal();
  const pendiente = maaserPendiente();
  const pagos = [...state.maaserPagos].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const rows = pagos.map(p=>`
    <div class="item">
      <span class="i-date">${p.fecha.slice(5)}</span>
      <div class="i-main">
        ${p.desc ? `<div class="i-desc">${p.desc}</div>` : `<div class="i-desc">Pago de maaser</div>`}
      </div>
      <span class="i-amt">${fmtARS(p.monto)}</span>
      <button class="del" data-del-pago="${p.id}">✕</button>
    </div>
  `).join('');

  return `
  <div class="card">
    <div class="card-title">Estado del maaser</div>
    <div class="stat-row"><span class="label">Generado (histórico)</span><span class="value">${fmtARS(generado)}</span></div>
    <div class="stat-row"><span class="label">Pagado</span><span class="value pos">${fmtARS(pagado)}</span></div>
    <div class="big-total">
      <span class="label">Debés</span>
      <span class="value ${pendiente>0?'neg':'pos'}">${fmtARS(pendiente)}</span>
    </div>
    <div class="settings-row">
      <span>% de maaser</span>
      <input type="number" id="maaserPct" value="${state.settings.maaserPct}" min="1" max="100" step="0.5">
    </div>
  </div>

  <div class="card">
    <div class="card-title">Registrar pago</div>
    <form class="entry" id="formMaaserPago">
      <div class="f-row">
        <div class="field">
          <label>Fecha</label>
          <input type="date" name="fecha" value="${todayStr()}" required>
        </div>
        <div class="field">
          <label>Monto ($)</label>
          <input type="number" name="monto" step="0.01" min="0" required>
        </div>
      </div>
      <div class="field">
        <label>Descripción (opcional)</label>
        <input type="text" name="desc">
      </div>
      <button type="submit" class="primary">Registrar pago</button>
    </form>
  </div>

  <div class="card">
    <div class="card-title">Pagos registrados</div>
    <div class="list">
      ${pagos.length ? rows : `<div class="empty">Todavía no registraste ningún pago.</div>`}
    </div>
  </div>
  `;
}

function renderUSD(){
  const total = usdTotal();
  const items = [...state.usd].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const rows = items.map(u=>`
    <div class="item">
      <span class="i-date">${u.fecha.slice(5)}</span>
      <div class="i-main">
        <div class="i-desc">${u.desc || (u.cotizacion ? 'cotización ' + fmtARS(u.cotizacion) : '')}</div>
      </div>
      <span class="i-amt pos">${fmtUSD(u.montoUSD)}</span>
      <button class="del" data-del-usd="${u.id}">✕</button>
    </div>
  `).join('');

  return `
  <div class="card">
    <div class="card-title">Ahorro en dólares</div>
    <div class="big-total" style="border-top:none; padding-top:0; margin-top:0;">
      <span class="label">Llevás ahorrado</span>
      <span class="value" style="color:var(--accent);">${fmtUSD(total)}</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Registrar cambio a USD</div>
    <form class="entry" id="formUSD">
      <div class="f-row">
        <div class="field">
          <label>Fecha</label>
          <input type="date" name="fecha" value="${todayStr()}" required>
        </div>
        <div class="field">
          <label>Monto US$</label>
          <input type="number" name="montoUSD" step="0.01" min="0" required>
        </div>
      </div>
      <div class="f-row">
        <div class="field">
          <label>Cotización (opc.)</label>
          <input type="number" name="cotizacion" step="0.01" min="0">
        </div>
        <div class="field">
          <label>$ gastados (opc.)</label>
          <input type="number" name="montoARS" step="0.01" min="0">
        </div>
      </div>
      <div class="field">
        <label>Descripción (opcional)</label>
        <input type="text" name="desc">
      </div>
      <button type="submit" class="primary">Registrar</button>
    </form>
  </div>

  <div class="card">
    <div class="card-title">Historial de cambios</div>
    <div class="list">
      ${items.length ? rows : `<div class="empty">Todavía no registraste ningún cambio.</div>`}
    </div>
  </div>
  `;
}

function wireEvents(){
  const monthInput = document.getElementById('monthInput');
  if(monthInput){
    monthInput.addEventListener('change', e=>{ currentMonth = e.target.value; render(); });
  }

  const formIngreso = document.getElementById('formIngreso');
  if(formIngreso){
    formIngreso.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(formIngreso);
      state.movements.push({
        id: uid(), type:'ingreso',
        fecha: fd.get('fecha'), categoria: fd.get('categoria'),
        desc: fd.get('desc'), monto: parseFloat(fd.get('monto'))
      });
      await save('movements', state.movements);
      render();
    });
  }

  const formGasto = document.getElementById('formGasto');
  if(formGasto){
    formGasto.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(formGasto);
      state.movements.push({
        id: uid(), type:'gasto',
        fecha: fd.get('fecha'), categoria: fd.get('categoria'),
        desc: fd.get('desc'), monto: parseFloat(fd.get('monto'))
      });
      await save('movements', state.movements);
      render();
    });
  }

  const formMaaserPago = document.getElementById('formMaaserPago');
  if(formMaaserPago){
    formMaaserPago.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(formMaaserPago);
      state.maaserPagos.push({
        id: uid(), fecha: fd.get('fecha'), desc: fd.get('desc'),
        monto: parseFloat(fd.get('monto'))
      });
      await save('maaser_pagos', state.maaserPagos);
      render();
    });
  }

  const maaserPctInput = document.getElementById('maaserPct');
  if(maaserPctInput){
    maaserPctInput.addEventListener('change', async e=>{
      state.settings.maaserPct = parseFloat(e.target.value) || 10;
      await save('settings', state.settings);
      render();
    });
  }

  const formUSD = document.getElementById('formUSD');
  if(formUSD){
    formUSD.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(formUSD);
      const montoUSD = parseFloat(fd.get('montoUSD'));
      let cotizacion = fd.get('cotizacion') ? parseFloat(fd.get('cotizacion')) : null;
      let montoARS = fd.get('montoARS') ? parseFloat(fd.get('montoARS')) : null;
      if(cotizacion && !montoARS){ montoARS = montoUSD * cotizacion; }
      state.usd.push({ id: uid(), fecha: fd.get('fecha'), desc: fd.get('desc'), montoUSD, cotizacion, montoARS });
      await save('usd_savings', state.usd);
      render();
    });
  }

  document.querySelectorAll('[data-del-mov]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.movements = state.movements.filter(m=>m.id !== btn.dataset.delMov);
      await save('movements', state.movements);
      render();
    });
  });
  document.querySelectorAll('[data-del-pago]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.maaserPagos = state.maaserPagos.filter(p=>p.id !== btn.dataset.delPago);
      await save('maaser_pagos', state.maaserPagos);
      render();
    });
  });
  document.querySelectorAll('[data-del-usd]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.usd = state.usd.filter(u=>u.id !== btn.dataset.delUsd);
      await save('usd_savings', state.usd);
      render();
    });
  });
}

(async function init(){
  document.getElementById('content').innerHTML = '<div class="card"><div class="empty">Cargando...</div></div>';
  await loadAll();
  render();
})();
</script>
</body>
</html>
